<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel ECLSS - Marte</title>
</head>
<body>
    <h1>Painel de Controle de Recursos</h1>
    <input type="text" id="cota-oxigenio" placeholder="Digite a cota">
    <button id="btn-solicitar" onclick="solicitar()">Solicitar Cota</button>
    <div id="status-mensagem"></div>

    <script>
        function solicitar() {
            document.getElementById('status-mensagem').innerText = "Sucesso: Cota aplicada!";
        }
    </script>
</body>
</html>
